<section class="section brands py-5">
    <div class="row justify-content-center">
      {{ with .content.title }}
        <div class="col-12">
          <h3 class="fs-5 text-primary text-center pb-4">{{ . }}</h3>
        </div>
      {{ end }}
    </div>
    <div class="row align-items-center justify-content-center">
      {{ range .content.items }}
      <div class="col px-3 my-2 text-center">
        <img src="{{.}}" class="image-fluid customer-logo">
      </div>
      {{ end }}
    </div>
</section>
